[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "quarry-elt"
version = "0.1.0"
description = "Dagster ELT pipeline for quarry data ingestion and embedding"
requires-python = ">=3.13"
dependencies = [
    "quarry",
    "dagster",
    "dagster-postgres>=0.28.20",
    "dagster-webserver",
    "dagster-dg-cli>=1.12.19",
    "peft>=0.18.1",
    "torch",
    "sentence-transformers",
    "blake3",
    "httpx",
    "boto3",
    "duckdb",
    "pylance>=4.0.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
quarry-elt = "quarry_elt.cli:app"

[tool.uv.sources]
# Editable path dep — not a workspace member, so quarry-elt gets its own
# uv.lock and .venv, isolating dagster's antlr4 4.13 from server's antlr4 4.9.
quarry = { path = "../quarry", editable = true }

[tool.setuptools.packages.find]
where = ["."]
include = ["quarry_elt", "quarry_elt.*"]

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "quarry_elt"
code_location_target_module = "quarry_elt.defs"

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s %(name)s %(levelname)s %(message)s"
log_cli_date_format = "%H:%M:%S"
