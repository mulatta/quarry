[package]
name = "quarry-rs"
version = "0.2.0"
edition = "2024"

[lib]
name = "quarry_rs"
crate-type = ["lib", "cdylib"]

[features]
default = []
python = ["pyo3"]
extension-module = ["python", "pyo3/extension-module"]

[dependencies]
# Parse: XML, JSON, text processing
quick-xml = "0.37"
sonic-rs = "0.5"
regex = "1"
flate2 = "1"
rayon = "1.10"

# Build: PG + S3
serde = { version = "1", features = ["derive"] }
object_store = { version = "0.12", features = ["aws"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
futures = "0.3"
postgres = "0.19"

# Python bindings (optional)
pyo3 = { version = "0.24", optional = true }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
opt-level = 3
