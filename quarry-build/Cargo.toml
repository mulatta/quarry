[package]
name = "quarry-build"
version = "0.1.0"
edition = "2024"

[lib]
name = "quarry_build"
crate-type = ["lib", "cdylib"]

[features]
default = []
python = ["pyo3"]
extension-module = ["python", "pyo3/extension-module"]

[dependencies]
# Core crate (normalize, abstract_recon)
quarry-core = { path = "../quarry-core" }

# Parse: XML, JSON
quick-xml = "0.37"
sonic-rs = "0.5"
serde = { version = "1", features = ["derive"] }
flate2 = "1"
rayon = "1.10"

# Build: PG + S3
object_store = { version = "0.12", features = ["aws"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
futures = "0.3"
postgres = "0.19"
crossbeam-channel = "0.5"

# Python bindings (optional)
pyo3 = { version = "0.24", optional = true }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
opt-level = 3
