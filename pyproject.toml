[project]
name = "quarry"
version = "0.2.0"
description = "PubMed-primary academic paper exploration + citation graph mining system"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dagster",
    "dagster-webserver",
    "duckdb",
    "lancedb",
    "numpy",
    "orjson",
    "blake3",
    "pyarrow",
    "pydantic-settings",
    "httpx",
    "lxml",
    "peft",
    "sentence-transformers",
    "torch",
    "mcp[cli]",
    "dagster-dg-cli>=1.12.19",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["quarry", "quarry.*"]

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "quarry"
code_location_target_module = "quarry.defs"
