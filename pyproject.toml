[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "quarry"
version = "0.2.0"
description = "PubMed-primary academic paper exploration + citation graph mining system"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dagster-postgres>=0.28.20",
    "psycopg[binary]",
    "pydantic-settings",
]

[project.optional-dependencies]
server = [
    "quarry-core",
    "quarry-graph",
    "lancedb",
    "numpy",
    "pyarrow",
    "mcp[cli]",
]
cli = [
    "quarry[server]",
    "typer",
]
elt = [
    "quarry[server]",
    "dagster",
    "dagster-webserver",
    "dagster-dg-cli>=1.12.19",
    "torch",
    "sentence-transformers",
    "blake3",
    "httpx",
]

[project.scripts]
quarry = "quarry.cli:app"

[tool.uv.workspace]
members = ["quarry-core", "quarry-graph"]

[tool.uv.sources]
quarry-core = { workspace = true }
quarry-graph = { workspace = true }

[tool.setuptools.packages.find]
where = ["."]
include = ["quarry", "quarry.*"]

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "quarry"
code_location_target_module = "quarry.defs"
