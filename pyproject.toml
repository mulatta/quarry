[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "quarry"
version = "0.2.0"
description = "Academic paper discovery via citation graph traversal, MeSH ontology, and semantic search"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "psycopg[binary]",
    "pydantic>=2",
    "pydantic-settings",
    "pyyaml",
]

[project.optional-dependencies]
# Server process: MCP HTTP server + full-text fetch pipeline
server = [
    "quarry-core",
    "quarry-graph",
    "lancedb",
    "numpy",
    "pyarrow",
    "mcp[cli]",
    "docling>=2.86.0",
    "httpx>=0.28.1",
    "playwright>=1.58.0",
    "playwright-stealth>=2.0.3",
    "pymupdf>=1.27.2.2",
]
cli = [
    "quarry[server]",
    "typer",
]
elt = [
    "quarry[server]",
    "dagster",
    "dagster-postgres>=0.28.20",
    "dagster-webserver",
    "dagster-dg-cli>=1.12.19",
    "peft>=0.18.1",
    "torch",
    "sentence-transformers",
    "blake3",
    "httpx",
    "boto3",
    "duckdb",
    "pylance>=4.0.0",
]
dev = [
    "quarry[elt]",
    "pytest",
]

[project.scripts]
quarry = "quarry.cli:app"
quarry-server = "quarry.mcp.server:main"

[tool.uv.workspace]
members = [
    "crates/quarry-core",
    "crates/quarry-graph",
]

[tool.uv.sources]
quarry-core = { workspace = true }
quarry-graph = { workspace = true }

[tool.setuptools.packages.find]
where = ["."]
include = ["quarry", "quarry.*"]

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s %(name)s %(levelname)s %(message)s"
log_cli_date_format = "%H:%M:%S"

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "quarry"
code_location_target_module = "quarry.defs"
