[project]
name = "quarry"
version = "0.1.0"
description = "Academic paper exploration + citation graph mining system"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dagster",
    "dagster-webserver",
    "clickhouse-connect",
    "lancedb",
    "numpy",
    "orjson",
    "blake3",
    "pyarrow",
    "pydantic-settings",
    "httpx",
    "rustworkx",
]

[tool.dagster]
module_name = "quarry.definitions"
