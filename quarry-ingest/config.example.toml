# quarry-ingest configuration
# Usage: quarry-ingest --config config.toml load oa ...
# Priority: CLI args > env vars > this file > defaults.

# S3 download concurrency (default: 8, max: 64)
s3_download_concurrency = 8

# Downloaded-but-not-yet-parsed file buffer slots (default: 0 = auto).
# Decouples download from parse — larger values keep downloads flowing
# while parse is CPU-bound. Each slot holds ~50-100MB.
# Auto = s3_download_concurrency.
prefetch_buffer = 24

# Parallel PG COPY writer threads (default: 4, max: 16)
pg_writer_threads = 16

# Channel buffer between parse and PG writers (default: 0 = auto)
# Auto = s3_download_concurrency * 2.
channel_buffer = 0

# Parse thread count for PubMed (default: auto from available memory)
# Each thread holds ~400MB. Set 0 or omit for auto.
# parse_threads = 0

# S3 fetch retry settings
fetch_max_retries = 3
fetch_initial_backoff_ms = 2000
fetch_max_backoff_ms = 30000

# OpenAlex tier domains (T2 classification)
# t2_domains = ["Health Sciences", "Life Sciences", "Physical Sciences", "Engineering"]
