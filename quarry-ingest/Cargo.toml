[package]
name = "quarry-ingest"
version = "0.1.0"
edition = "2024"

[lib]
name = "quarry_ingest"

[dependencies]
# Core crate (normalize, abstract_recon)
quarry-core = { path = "../quarry-core" }

# Parse: XML, JSON
quick-xml = "0.37"
sonic-rs = "0.5"
serde = { version = "1", features = ["derive"] }
flate2 = { version = "1", features = ["zlib-ng"], default-features = false }
rayon = "1.10"

# Build: PG + S3
bytes = "1"
object_store = { version = "0.12", features = ["aws"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
futures = "0.3"
postgres = "0.19"
crossbeam-channel = "0.5"

# CLI
clap = { version = "4", features = ["derive", "env"] }
serde_json = "1"
toml = "0.8"
csv = "1"

[[bin]]
name = "quarry-ingest"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
opt-level = 3
