[package]
name = "quarry-parse"
version = "0.1.0"
edition = "2024"

[lib]
name = "quarry_parse"
crate-type = ["cdylib", "lib"]

[features]
default = []
python = ["pyo3", "pyo3-arrow"]
extension-module = ["python", "pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.24", optional = true }
arrow = { version = "55", features = ["ffi"] }
pyo3-arrow = { version = "0.9", optional = true }
quick-xml = "0.37"
flate2 = "1"
rayon = "1.10"
sonic-rs = "0.5"
regex = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
opt-level = 3
