[package]
name = "quarry-parse"
version = "0.1.0"
edition = "2024"

[lib]
name = "quarry_parse"
crate-type = ["lib", "cdylib"]

[features]
default = []
python = ["pyo3"]
extension-module = ["python", "pyo3/extension-module"]

[dependencies]
# Core crate (normalize, abstract_recon)
quarry-core = { path = "../quarry-core" }

# Parse: XML, JSON
quick-xml = { version = "0.37", features = ["serde", "serialize"] }
sonic-rs = "0.5"
serde = { version = "1", features = ["derive"] }
flate2 = { version = "1", features = ["zlib-ng"], default-features = false }
rayon = "1.10"

# Parquet output
arrow = "55"
parquet = { version = "55", features = ["zstd"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }
serde_json = "1"

# Allocator — mimalloc avoids glibc arena fragmentation in threaded workloads
mimalloc = { version = "0.1", default-features = false }

# Python bindings (optional)
pyo3 = { version = "0.24", optional = true }

[[bin]]
name = "quarry-parse"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
opt-level = 3
