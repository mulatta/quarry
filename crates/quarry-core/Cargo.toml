[package]
name = "quarry-core"
version = "0.1.0"
edition = "2024"

[lib]
name = "quarry_core"
crate-type = ["lib", "cdylib"]

[features]
default = []
python = ["pyo3"]
extension-module = ["python", "pyo3/extension-module"]

[dependencies]
# Text processing
sonic-rs = "0.5"
regex = "1"
rayon = "1.10"

# Python bindings (optional)
pyo3 = { version = "0.24", optional = true }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
opt-level = 3
