[package]
name = "quarry-graph"
version = "0.1.0"
edition = "2024"

[lib]
name = "quarry_graph"
crate-type = ["cdylib", "lib"]

[dependencies]
pyo3 = "0.24"
rayon = "1.10"
memmap2 = "0.9"
serde_json = "1"

[features]
extension-module = ["pyo3/extension-module"]
default = []

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
opt-level = 3
